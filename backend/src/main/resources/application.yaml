server:
  # Hosts like Railway tell the app which port to listen on through PORT.
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/limitless}
    username: ${DB_USERNAME:limitless_user}
    password: ${DB_PASSWORD:limitless_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

uploads:
  dir: ./uploads

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
  expiration-minutes: 60

app:
  # Public address of the site, used for links in emails.
  url: ${APP_URL:http://localhost:3000}
  # First administrator, created at startup only when ADMIN_PASSWORD is set and no administrator exists yet.
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@limitless.local}
    password: ${ADMIN_PASSWORD:}
